<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var EXT_PROTO_RE = /(?:chrome|moz|safari(?:-web)?)-extension:\/\//i;
        function isExtensionOrigin(filename, stack) {
          if (typeof filename === 'string' && EXT_PROTO_RE.test(filename)) {
            return true;
          }
          if (typeof stack === 'string' && EXT_PROTO_RE.test(stack)) {
            var lines = stack.split('\n');
            var hasFrame = false;
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (/^\s*at\s+/i.test(line) || /@/.test(line)) {
                hasFrame = true;
                if (!EXT_PROTO_RE.test(line)) {
                  return false;
                }
              }
            }
            return hasFrame;
          }
          return false;
        }
        window.addEventListener(
          'error',
          function (event) {
            var stack = event && event.error && event.error.stack;
            if (isExtensionOrigin(event && event.filename, stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var stack = reason && reason.stack;
            if (isExtensionOrigin('', stack)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
